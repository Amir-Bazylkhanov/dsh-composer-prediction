name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependencies to install: the package has only peer dependencies and
      # the bundle is generated by a local script.
      - name: Rebuild the client bundle and run every test
        run: npm run check

      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --quiet -- lib/client.js; then
            echo "::error::lib/client.js is out of date — run 'npm run build' and commit the result."
            git diff --stat -- lib/client.js
            exit 1
          fi

      - name: Verify the publishable tarball
        run: npm pack --dry-run

      - name: Warn if the market index is behind package.json
        run: |
          node scripts/build-market.mjs
          if ! git diff --quiet -- market/index.json; then
            echo "::warning::market/index.json does not list the current version — run 'node scripts/build-market.mjs' and commit it."
          fi
